<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Administração | Evye Doces</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              pink: '#FF6B8B',
              light: '#FFF0F3',
              dark: '#D84315'
            }
          }
        }
      }
    }
  </script>

  <!-- Estilos para Impressão (Garante que só imprime o pedido selecionado) -->
  <style>
    @media print {
      /* Oculta tudo na página por padrão */
      body * {
        visibility: hidden !important;
      }

      /* Exibe apenas o pedido marcado para impressão */
      .print-active,
      .print-active * {
        visibility: visible !important;
      }

      /* Posiciona o pedido no topo da folha */
      .print-active {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        box-shadow: none !important;
        border: 1px solid #e2e8f0 !important;
        padding: 20px !important;
      }

      /* Oculta os botões de ação na impressão */
      .print-active .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header Admin -->
  <header class="bg-white border-b sticky top-0 z-10 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🧁</span>
        <div>
          <h1 class="text-xl font-bold text-slate-900">Evye Doces - Painel Admin</h1>
          <p class="text-xs text-slate-500">Gestão e acompanhamento de pedidos</p>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <button onclick="fetchOrders()" class="bg-slate-100 text-slate-700 px-3 py-2 rounded-lg text-sm font-medium hover:bg-slate-200 transition flex items-center gap-1">
          🔄 Atualizar Pedidos
        </button>
        <a href="/" target="_blank" class="bg-brand-pink text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-pink-600 transition">
          🛍️ Ir para a Loja
        </a>
        <button onclick="logout()" class="bg-red-50 text-red-600 border border-red-200 px-3 py-2 rounded-lg text-sm font-bold hover:bg-red-100 transition flex items-center gap-1">
          🚪 Sair
        </button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-1">
    
    <!-- Métricas -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4">
        <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center text-2xl font-bold">⏳</div>
        <div>
          <p class="text-xs text-slate-500 font-medium uppercase">Pedidos Pendentes</p>
          <p id="pending-orders-count" class="text-2xl font-extrabold text-slate-900">0</p>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4">
        <div class="w-12 h-12 bg-green-100 text-green-600 rounded-xl flex items-center justify-center text-2xl font-bold">💰</div>
        <div>
          <p class="text-xs text-slate-500 font-medium uppercase">Faturamento Total</p>
          <p id="total-revenue" class="text-2xl font-extrabold text-slate-900">R$ 0,00</p>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center">
        <input type="text" id="search-input" oninput="filterOrders()" placeholder="🔎 Pesquisar cliente ou endereço..." class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-pink">
      </div>
    </div>

    <!-- Navegação por Abas -->
    <div class="flex border-b border-slate-200 mb-6 gap-2">
      <button id="tab-pending-btn" onclick="switchTab('pending')" class="px-5 py-2.5 font-bold text-sm border-b-2 border-brand-pink text-brand-pink transition flex items-center gap-2">
        ⏳ Pedidos Pendentes <span id="badge-pending" class="bg-pink-100 text-brand-pink text-xs px-2 py-0.5 rounded-full">0</span>
      </button>
      <button id="tab-completed-btn" onclick="switchTab('completed')" class="px-5 py-2.5 font-medium text-sm text-slate-500 hover:text-slate-800 transition flex items-center gap-2">
        ✅ Pedidos Finalizados <span id="badge-completed" class="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded-full">0</span>
      </button>
    </div>

    <!-- Lista de Pedidos -->
    <div id="orders-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-slate-500 col-span-full text-center py-12">Carregando pedidos...</p>
    </div>

  </main>

  <script>
    let allOrders = [];
    let currentTab = 'pending';

    async function checkAuth() {
      try {
        const res = await fetch('/api/check-auth');
        const data = await res.json();
        if (!data.authenticated) {
          window.location.href = '/login.html';
        }
      } catch (err) {
        window.location.href = '/login.html';
      }
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    }

    async function fetchOrders() {
      try {
        const res = await fetch('/api/orders');
        allOrders = await res.json();
        updateDashboard();
        renderOrders();
      } catch (err) {
        console.error('Erro ao buscar pedidos:', err);
        document.getElementById('orders-container').innerHTML = `
          <p class="text-red-500 col-span-full text-center py-8">Erro ao carregar os pedidos do servidor.</p>
        `;
      }
    }

    function updateDashboard() {
      const pendingOrders = allOrders.filter(o => (o.status || 'pending') === 'pending');
      const completedOrders = allOrders.filter(o => o.status === 'completed');

      document.getElementById('pending-orders-count').innerText = pendingOrders.length;
      document.getElementById('badge-pending').innerText = pendingOrders.length;
      document.getElementById('badge-completed').innerText = completedOrders.length;

      const revenue = allOrders.reduce((sum, order) => sum + (order.total || 0), 0);
      document.getElementById('total-revenue').innerText = `R$ ${revenue.toFixed(2).replace('.', ',')}`;
    }

    function switchTab(tab) {
      currentTab = tab;
      const pendingBtn = document.getElementById('tab-pending-btn');
      const completedBtn = document.getElementById('tab-completed-btn');

      if (tab === 'pending') {
        pendingBtn.className = "px-5 py-2.5 font-bold text-sm border-b-2 border-brand-pink text-brand-pink transition flex items-center gap-2";
        completedBtn.className = "px-5 py-2.5 font-medium text-sm text-slate-500 hover:text-slate-800 transition flex items-center gap-2";
      } else {
        completedBtn.className = "px-5 py-2.5 font-bold text-sm border-b-2 border-green-500 text-green-600 transition flex items-center gap-2";
        pendingBtn.className = "px-5 py-2.5 font-medium text-sm text-slate-500 hover:text-slate-800 transition flex items-center gap-2";
      }

      renderOrders();
    }

    async function completeOrder(orderId) {
      try {
        const res = await fetch(`/api/orders/${orderId}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'completed' })
        });

        if (res.ok) {
          fetchOrders();
        } else {
          alert('Erro ao atualizar o status do pedido.');
        }
      } catch (err) {
        alert('Erro de rede ao finalizar o pedido.');
      }
    }

    async function deleteOrder(orderId) {
      if (!confirm(`Tem certeza de que deseja eliminar permanentemente o pedido #${orderId}?`)) {
        return;
      }

      try {
        const res = await fetch(`/api/orders/${orderId}`, {
          method: 'DELETE'
        });

        if (res.ok) {
          fetchOrders();
        } else {
          alert('Erro ao eliminar o pedido.');
        }
      } catch (err) {
        alert('Erro de rede ao eliminar o pedido.');
      }
    }

    // Função de impressão individual do pedido
    function printSingleOrder(orderId) {
      // Remove a marcação de impressão de qualquer outro cartão
      document.querySelectorAll('.order-card').forEach(card => card.classList.remove('print-active'));

      // Adiciona a marcação apenas ao cartão do pedido que clicou
      const orderCard = document.getElementById(`order-card-${orderId}`);
      if (orderCard) {
        orderCard.classList.add('print-active');
        window.print();
      }
    }

    function filterOrders() {
      renderOrders();
    }

    function renderOrders() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const container = document.getElementById('orders-container');

      const filtered = allOrders.filter(order => {
        const orderStatus = order.status || 'pending';
        const matchesTab = orderStatus === currentTab;
        const matchesQuery = order.customer_name.toLowerCase().includes(query) || 
                             order.customer_address.toLowerCase().includes(query);
        return matchesTab && matchesQuery;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-white p-12 rounded-2xl shadow-sm text-center border border-slate-200">
            <p class="text-slate-400 text-lg">Nenhum pedido ${currentTab === 'pending' ? 'pendente' : 'finalizado'}.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(order => {
        let items = [];
        try {
          items = typeof order.items === 'string' ? JSON.parse(order.items) : order.items;
        } catch (e) {
          items = [];
        }

        const date = new Date(order.created_at).toLocaleString('pt-BR', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });

        const isPending = (order.status || 'pending') === 'pending';

        return `
          <div id="order-card-${order.id}" class="order-card bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col justify-between hover:shadow-md transition">
            <div>
              <div class="flex justify-between items-start border-b pb-3 mb-3">
                <div>
                  <span class="text-xs font-bold text-slate-400">PEDIDO #${order.id}</span>
                  <h3 class="font-bold text-slate-800 text-lg leading-snug">${order.customer_name}</h3>
                </div>
                <span class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded font-medium">${date}</span>
              </div>

              <div class="mb-4">
                <p class="text-xs text-slate-500 font-semibold uppercase tracking-wider mb-1">📍 Endereço de Entrega:</p>
                <p class="text-sm text-slate-700 bg-slate-50 p-2 rounded-lg border border-slate-100">${order.customer_address}</p>
              </div>

              <div class="mb-4">
                <p class="text-xs text-slate-500 font-semibold uppercase tracking-wider mb-2">🛍️ Itens do Pedido:</p>
                <ul class="space-y-1.5 text-sm divide-y divide-slate-100">
                  ${items.map(i => `
                    <li class="pt-1.5 flex justify-between text-slate-700">
                      <span><b class="text-brand-pink">${i.qty}x</b>${i.name}</span>
                      <span class="font-medium text-slate-500">R$ ${(i.price * i.qty).toFixed(2).replace('.', ',')}</span>
                    </li>
                  `).join('')}
                </ul>
              </div>
            </div>

            <div class="border-t pt-3 mt-2">
              <div class="flex justify-between items-center mb-4">
                <span class="text-xs text-slate-500 font-bold uppercase">Total do Pedido</span>
                <span class="text-xl font-extrabold text-slate-900">R$ ${Number(order.total).toFixed(2).replace('.', ',')}</span>
              </div>

              <div class="no-print">
                ${isPending ? `
                  <button onclick="completeOrder(${order.id})" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold py-2.5 rounded-lg transition mb-2 shadow flex items-center justify-center gap-1">
                    ✅ Finalizar Pedido
                  </button>
                ` : `
                  <div class="w-full bg-slate-100 text-slate-500 text-xs font-bold py-2 rounded-lg text-center mb-2">
                    ✓ Pedido Concluído
                  </div>
                `}

                <div class="grid grid-cols-2 gap-2">
                  <button onclick="printSingleOrder(${order.id})" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-2 rounded-lg transition">
                    🖨️ Imprimir
                  </button>
                  <button onclick="deleteOrder(${order.id})" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-xs font-bold py-2 rounded-lg transition">
                    🗑️ Eliminar
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    checkAuth();
    fetchOrders();
    setInterval(fetchOrders, 30000);
  </script>
</body>
</html>
